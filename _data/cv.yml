- title: Recent academic interests
  type: nested_list
  contents:
    - title: Foundation of the theory of metric&#45;measure spaces with Riemannian Ricci curvature bounded from below (the so-called RCD(K,&#8734;) condition)
    - title: Metric&#45;Sobolev spaces, identification of the construction by Lipschitz functions and Cheeger energy with the Newtonian approach
    - title: Entropy-Transport formulation for unbalanced optimal transport and the characterization of the new Hellinger&#45;Kantorovich distance
    - title: Foundation of Balanced Viscosity and Visco&#45;Energetic solutions to rate&#45;independent processes in infinite&#45;dimensional spaces
    - title: Dissipative evolutions of probability measures
    - title: The mean&#45;field formulation of spatially inhomogeneous Evolutionary Games

